
name: Build Alberta Prime APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      
      - name: Install Android SDK
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"


      

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        run: unzip -q AlbertaPrimeBlinds_v5_Android_Source.zip -d android

     
      - name: Build APK
        working-directory: android
        run: |
          sed -i 's/import android.app.PrintManager;/import android.print.PrintManager;/' app/src/main/java/ca/albertaprime/blinds/MainActivity.java
          gradle --no-daemon :app:assembleDebug
 

      - uses: actions/upload-artifact@v4
        with:
          name: AlbertaPrimeBlinds-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
